spring.application.name=backend

# Native Spring Boot import for .env file (checks current working dir & project root)
spring.config.import=optional:file:.env[.properties], optional:file:../.env[.properties]

# Database Configuration (PostgreSQL by default)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:edore}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:edore}
spring.datasource.password=${DB_PASSWORD:edore}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Mail Configuration (Gmail / Mailpit dev default)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
server.forward-headers-strategy=framework

# JWT Configuration
jwt.secret=${JWT_SECRET:Y2hhbmdlLW1lLWNoYW5nZS1tZS1jaGFuZ2UtbWUtY2hhbmdlLW1lLWNoYW5nZS1tZS1jaGFuZ2UtbWUtY2hhbmdlLW1l}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# Cookie Configuration
cookie.secure=${COOKIE_SECURE:false}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# PayOS Configuration
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payos.return-url=${PAYOS_RETURN_URL:http://localhost:5173/#/payment-result}
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:5173/#/payment-result?cancel=true}

# LLM & Embedding API Configuration
llm.base-url=${BEEKNOEE_BASE_URL:https://platform.beeknoee.com}
llm.api-key=${BEEKNOEE_API_KEY:}
llm.model=${BEEKNOEE_MODEL:}
llm.max-tokens=${BEEKNOEE_MAX_TOKENS:16000}
llm.temperature=${BEEKNOEE_TEMPERATURE:0.4}
llm.large-file-threshold=${LLM_LARGE_FILE_THRESHOLD:60000}
llm.embedding-base-url=${EMBEDDING_BASE_URL:}
llm.embedding-api-key=${EMBEDDING_API_KEY:}
llm.embedding-model=${EMBEDDING_MODEL:sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
llm.timeout-seconds=${LLM_TIMEOUT_SECONDS:300}
llm.max-file-size-kb=${LLM_MAX_FILE_SIZE_KB:150}

# Qdrant Infrastructure Connection
qdrant.enabled=${QDRANT_ENABLED:false}
qdrant.host=${QDRANT_HOST:localhost}
qdrant.port=${QDRANT_PORT:6334}
qdrant.timeout-seconds=${QDRANT_TIMEOUT_SECONDS:3}
qdrant.vector-dim=${QDRANT_VECTOR_DIM:384}

# Qdrant Vector Match Domain Configuration
qdrant.match.collection-curriculum=${QDRANT_COLLECTION_CURRICULUM:curriculum_reference}
qdrant.match.collection-activities=${QDRANT_COLLECTION_ACTIVITIES:activity_bank}
qdrant.match.similarity-strong-threshold=${QDRANT_STRONG_THRESHOLD:0.75}
qdrant.match.similarity-weak-threshold=${QDRANT_WEAK_THRESHOLD:0.45}
qdrant.match.top-k=${QDRANT_TOP_K:5}

# Spring Boot Actuator & Health Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
