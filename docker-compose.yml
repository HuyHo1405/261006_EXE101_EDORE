services:

  # ── AI Vector DB (Qdrant) ────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: edore_qdrant
    profiles: [edore-backend]
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "cat /dev/null > /dev/tcp/localhost/6333 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Text Embeddings Inference (Multilingual MiniLM - Vietnamese) ─────────
  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    container_name: edore_embedding
    profiles: [edore-backend]
    command: ["--model-id", "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"]
    volumes:
      - embedding_model_cache:/data
    ports:
      - "8001:80"
    healthcheck:
      test: ["CMD-SHELL", "cat /dev/null > /dev/tcp/localhost/80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── edore-backend ─────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: edore_postgres
    profiles: [edore-backend]
    environment:
      POSTGRES_DB: ${DB_NAME:-edore}
      POSTGRES_USER: ${DB_USERNAME:-edore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-edore}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-edore} -d ${DB_NAME:-edore}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: edore_redis
    profiles: [edore-backend]
    command: >
      redis-server
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db-web-gui:
    image: dbgate/dbgate
    container_name: db-web-gui
    profiles: [edore-backend]
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./java-backend
      dockerfile: Dockerfile
    container_name: edore_backend
    profiles: [edore-backend]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-edore}
      DB_USERNAME: ${DB_USERNAME:-edore}
      DB_PASSWORD: ${DB_PASSWORD:-edore}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      QDRANT_ENABLED: ${QDRANT_ENABLED:-true}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embedding:80}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cat /dev/null > /dev/tcp/localhost/8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  embedding_model_cache:
  db-web-gui:
