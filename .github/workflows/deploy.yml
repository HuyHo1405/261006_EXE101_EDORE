name: EDORE CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── 1. FRONTEND TYPECHECK & LINT ──────────────────────────────────────────
  frontend-check:
    name: Frontend TypeCheck & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/apps/web/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend/apps/web
          npm ci

      - name: TypeCheck TypeScript
        run: |
          cd frontend/apps/web
          npx tsc --noEmit

  # ── 2. BACKEND COMPILE & BUILD DOCKER IMAGE ────────────────────────────────
  backend-check:
    name: Java Backend Compile & Docker Build
    runs-on: ubuntu-latest
    needs: frontend-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compile & Package Java App
        run: |
          cd java-backend
          mvn clean package -DskipTests

      - name: Build Docker Image Test
        run: |
          cd java-backend
          docker build -t edore-backend:test .
